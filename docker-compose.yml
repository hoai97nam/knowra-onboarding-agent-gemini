version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PROVIDER=ollama
      - OPENAI_API_KEY=
      - OPENAI_EMBEDDING_API_KEY=
      - OPENAI_BASE_URL=
      - PINECONE_API_KEY=pcsk_cVCrv_KwZT4hbriBncXDHxxAX4JNJLKnez9BGYfWNZLSM4tvriYdhjKLG4TErXoDNW31h
      - PINECONE_ENVIRONMENT=us-east-1
      - PINECONE_INDEX_NAME=knowra-onboarding

      - MONGODB_URL=mongodb+srv://tuantran245:Tranquoctuan0126@cluster0.pvdzsfu.mongodb.net/?appName=Cluster0
      - MONGODB_DB_NAME=knowra_chatbot
      - MONGODB_MAX_POOL_SIZE=10
      - MONGODB_MIN_POOL_SIZE=1
      - MONGODB_TIMEOUT_MS= 5000
      - PORT=8000
      - HOST=0.0.0.0
      - DATA_DIR=/app/data/raw
      - VECTOR_STORE_DIR=/app/.vectorstore
      - CHUNK_SIZE=1000                    # Size of text chunks (increase for larger context)
      - CHUNK_OVERLAP=200                   # Overlap between chunks (preserves context)
      - RETRIEVER_K=5                       # Number of documents to retrieve per query
      - MEMORY_WINDOW=10                    # Number of messages to keep in conversation memory
      - AUTO_REBUILD_ENABLED=false          # Auto-rebuild vector store when files change
      
      # ===== Optional: Advanced Chunking (improve context understanding) =====
      - CHUNK_ADD_SECTION_HEADERS=true      # Prepend section headers to chunks
      - CHUNK_EXTRACT_METADATA=true         # Extract YAML frontmatter metadata
      
      # ===== Optional: Streaming Configuration =====
      - SSE_DELAY=0.01                      # Delay between streaming chunks (seconds)

      - OLLAMA_BASE_URL=http://localhost:32770
      - OLLAMA_MODEL=mistral
      - OLLAMA_TEMPERATURE=0.7
      - OLLAMA_EMBEDDING_MODEL=nomic-embed-text
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./configs:/app/configs
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

networks:
  default:
    name: knowra-network
